services:

  postgres:
    image: postgres:15
    container_name: sirius-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-sirius}
      POSTGRES_USER: ${DB_USERNAME:-hms_sirius}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build: .
    container_name: sirius
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sirius}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-hms_sirius}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Kyiv}
      TZ: ${APP_TIME_ZONE:-Europe/Kyiv}

      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      APP_SELF_REGISTRATION_ENABLED: ${APP_SELF_REGISTRATION_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}

    ports:
      - "8080:8080"


volumes:
  postgres_data:
