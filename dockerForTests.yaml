
services:
  postgres-test:
    image: postgres:15
    container_name: sirius-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: sirius_test
      POSTGRES_USER: HMS_sirius
      POSTGRES_PASSWORD: HMS_sirius_test

    ports:
      - "5433:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U HMS_sirius -d sirius_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
