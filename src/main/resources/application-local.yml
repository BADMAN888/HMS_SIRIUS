spring:
  docker:
    compose:
      enabled: false
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:HMS_sirius}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:HMS_sirius}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  bootstrap-rate-components:
    enabled: true
