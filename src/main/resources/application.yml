spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  datasource:
    url: jdbc:postgresql://localhost:5432/sirius
    username: HMS_sirius
    password: HMS_sirius
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

security:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

app:
  mail:
    from: ${APP_MAIL_FROM:}
